<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tagesplaner</title>
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --ink: #201f1d;
    --muted: #78746c;
    --line: #e6e3dc;
    --accent: #c26b3f;
    --accent-soft: #f3e3d8;
    --done: #8fa88a;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 24px;
    max-width: 760px;
    margin: 0 auto;
  }
  header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 22px; margin: 0; }
  .date { color: var(--muted); font-size: 14px; }
  .settings { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .settings input[type=time] { border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font-size: 13px; }

  .block { background: var(--card); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; border: 1px solid var(--line); }
  .block.fixed { background: var(--accent-soft); border-color: transparent; }
  .block-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .block-time { font-weight: 600; font-size: 14px; }
  .block-label { font-size: 13px; color: var(--muted); }

  .task { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }
  .task:first-child { border-top: none; }
  .task input[type=checkbox] { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
  .task-title { font-size: 14.5px; line-height: 1.35; }
  .task.done .task-title { text-decoration: line-through; color: var(--muted); }
  .task-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 20px; background: var(--accent-soft); color: var(--accent); font-size: 11px; margin-right: 6px; }
  .star { color: var(--accent); }

  .expand-link { font-size: 12.5px; color: var(--accent); cursor: pointer; margin-top: 6px; display: inline-block; }

  section.backlog { margin-top: 28px; }
  section.backlog h2 { font-size: 16px; margin-bottom: 8px; }
  .cat-group { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 8px; overflow: hidden; }
  .cat-head { padding: 10px 14px; cursor: pointer; display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; }
  .cat-count { color: var(--muted); font-weight: 400; }
  .cat-body { padding: 0 14px 10px 14px; display: none; }
  .cat-body.open { display: block; }
  .cat-body .task { border-top: 1px solid var(--line); }
  .cat-body .task:first-child { border-top: 1px solid var(--line); }

  .add-form { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .add-form input[type=text] { flex: 1; min-width: 160px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 13.5px; }
  .add-form select, .add-form input[type=number] { padding: 8px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
  .add-form button { padding: 8px 14px; border: none; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; font-size: 13.5px; }
  label.important-check { display: flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--muted); }

  .done-section { margin-top: 24px; }
  .done-section h2 { font-size: 15px; color: var(--muted); }
  .empty-hint { color: var(--muted); font-size: 13px; padding: 6px 0; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Dein Tag</h1>
    <div class="date" id="dateLabel"></div>
  </div>
  <div class="settings">
    Start Arbeit: <input type="time" id="startTime">
  </div>
</header>

<div id="timeline"></div>

<section class="backlog">
  <h2>Alle offenen Aufgaben</h2>
  <div id="backlogGroups"></div>

  <div class="add-form">
    <input type="text" id="newTitle" placeholder="Neue Aufgabe...">
    <select id="newCategory"></select>
    <input type="number" id="newEst" placeholder="Min." style="width:70px" value="30">
    <label class="important-check"><input type="checkbox" id="newImportant"> wichtig</label>
    <button id="addBtn">+ Hinzufügen</button>
  </div>
</section>

<section class="done-section">
  <h2>Heute erledigt</h2>
  <div id="doneList"></div>
</section>

<script>
const CATEGORIES = {
  creatives:  { label: "🎨 Creatives & Ads",   },
  automation: { label: "🤖 Automation/Tech",   },
  finance:    { label: "💰 Finance/PNL",       },
  shop:       { label: "🏪 Shop/Ops",          },
  funnel:     { label: "🎯 Funnel/CS",         },
  video:      { label: "🎬 Video/Content",     },
  team:       { label: "👥 Team/Sonstiges",    },
  errand:     { label: "🚗 Termine/Erledigungen" },
};

const SEED_TASKS = [
  // Creatives & Ads
  { title: "Variations von winning ads zum Testen (Prompt)", category: "creatives", estMin: 45, important: true },
  { title: "Workflow für Variations für winning products", category: "creatives", estMin: 60, important: true },
  { title: "Research-Doc erstellen", category: "creatives", estMin: 60, important: true },
  { title: "Kampagnen killen", category: "creatives", estMin: 20 },
  { title: "Skill bearbeiten", category: "creatives", estMin: 30 },

  // Automation/Tech
  { title: "Automation Images", category: "automation", estMin: 60 },
  { title: "N8n / Obsidian einrichten", category: "automation", estMin: 60 },
  { title: "Co-Work Automation Mail erstellen (Novelising)", category: "automation", estMin: 45 },
  { title: "Funnelish Email Automation", category: "automation", estMin: 60 },
  { title: "Extra Docs/Adapter für Claude Automation", category: "automation", estMin: 45 },
  { title: "Frontend nutzbar machen", category: "automation", estMin: 60 },

  // Finance/PNL
  { title: "PNL Noveliska", category: "finance", estMin: 45 },
  { title: "PNL Cowork", category: "finance", estMin: 45 },
  { title: "Lohn zahlen", category: "finance", estMin: 15 },
  { title: "Lohn Zain", category: "finance", estMin: 15 },
  { title: "SOP: Lohn-Fehler-Checker pro Person", category: "finance", estMin: 30 },
  { title: "Finance-Dokumente speichern", category: "finance", estMin: 20 },
  { title: "KPI eintragen", category: "finance", estMin: 20 },

  // Shop/Ops
  { title: "Kizoora Änderungen im Shop", category: "shop", estMin: 30 },
  { title: "Neue Ad Accounts verknüpfen", category: "shop", estMin: 20 },
  { title: "Shopify-Fee ins PPL-Sheet eintragen", category: "shop", estMin: 15 },
  { title: "Shopify Abandon-Flow (dynamisches Update bei Checkout-Abbruch)", category: "shop", estMin: 45 },
  { title: "NL/BE UK-Ltd anmelden & launchen", category: "shop", estMin: 45 },
  { title: "Chargeflow IO einrichten", category: "shop", estMin: 30 },
  { title: "Chargeflow IO mit Valltrexo verbinden", category: "shop", estMin: 30 },
  { title: "E-Mail an CS wegen Valltrexo", category: "shop", estMin: 15 },

  // Funnel/CS
  { title: "Aftersell-Funnel für Upsell", category: "funnel", estMin: 60 },
  { title: "Sweet Upsell für SP", category: "funnel", estMin: 45 },
  { title: "SP Support Catalog Finnisch", category: "funnel", estMin: 30 },
  { title: "Langes PDF für CS (72h Antwortzeit)", category: "funnel", estMin: 45 },

  // Video/Content
  { title: "Video skripten (Instagram)", category: "video", estMin: 45 },
  { title: "Video drehen (Instagram)", category: "video", estMin: 60 },
  { title: "Video schneiden", category: "video", estMin: 60 },

  // Team/Sonstiges
  { title: "Nachrichten mit Brayan klären", category: "team", estMin: 15 },
  { title: "Sop Kim", category: "team", estMin: 20 },
  { title: "PR", category: "team", estMin: 20 },
];

// ---------- storage ----------
function loadTasks() {
  const raw = localStorage.getItem("plannerTasks");
  if (raw) return JSON.parse(raw);
  const seeded = SEED_TASKS.map((t, i) => ({ id: "t" + i, done: false, timePref: "any", ...t }));
  localStorage.setItem("plannerTasks", JSON.stringify(seeded));
  return seeded;
}
function saveTasks(tasks) {
  localStorage.setItem("plannerTasks", JSON.stringify(tasks));
}
function loadSettings() {
  const raw = localStorage.getItem("plannerSettings");
  return raw ? JSON.parse(raw) : { startTime: "08:00" };
}
function saveSettings(s) {
  localStorage.setItem("plannerSettings", JSON.stringify(s));
}

let tasks = loadTasks();
let settings = loadSettings();

// ---------- helpers ----------
function addMinutes(hhmm, mins) {
  const [h, m] = hhmm.split(":").map(Number);
  const total = h * 60 + m + mins;
  const nh = Math.floor(((total % 1440) + 1440) % 1440 / 60);
  const nm = ((total % 60) + 60) % 60;
  return String(nh).padStart(2, "0") + ":" + String(nm).padStart(2, "0");
}
function fmtRange(start, mins) {
  return start + "–" + addMinutes(start, mins);
}
function pickTasks(categories, count) {
  const pool = tasks.filter(t => !t.done && categories.includes(t.category));
  pool.sort((a, b) => (b.important === true) - (a.important === true));
  return pool.slice(0, count);
}

// ---------- render timeline ----------
function renderTimeline() {
  const start = settings.startTime;
  const timeline = document.getElementById("timeline");
  timeline.innerHTML = "";

  const block1Start = start;
  const breakfastStart = addMinutes(start, 90);
  const block2Start = addMinutes(breakfastStart, 30);
  const lunchStart = addMinutes(block2Start, 180);
  const block3Start = addMinutes(lunchStart, 60);
  const dinnerStart = addMinutes(block3Start, 270);

  const errandTasks = pickTasks(["errand"], 2);

  const blocks = [
    { time: fmtRange(block1Start, 90), label: "Arbeitsblock 1 – Admin & Finance", work: true, tasks: pickTasks(["finance", "team"], 2) },
    { time: fmtRange(breakfastStart, 30), label: "🍳 Frühstück", fixed: true },
    { time: fmtRange(block2Start, 180), label: "Arbeitsblock 2 – Creatives & Automation", work: true, tasks: pickTasks(["creatives", "automation"], 2) },
    { time: fmtRange(lunchStart, 60), label: "🍽️ Mittagessen", fixed: true },
    { time: fmtRange(block3Start, 270), label: "Arbeitsblock 3 – Shop, Funnel & Video (Abwechslung)", work: true, tasks: [...pickTasks(["shop", "funnel", "video"], 3), ...errandTasks] },
    { time: fmtRange(dinnerStart, 60), label: "🍲 Abendessen / Kochen", fixed: true },
    { time: "20:00–22:00", label: "🏋️ Gym", fixed: true },
  ];

  blocks.forEach(b => {
    const div = document.createElement("div");
    div.className = "block" + (b.fixed ? " fixed" : "");
    const head = document.createElement("div");
    head.className = "block-head";
    head.innerHTML = `<span class="block-time">${b.time}</span><span class="block-label">${b.label}</span>`;
    div.appendChild(head);

    if (b.work) {
      if (b.tasks.length === 0) {
        const hint = document.createElement("div");
        hint.className = "empty-hint";
        hint.textContent = "Keine offenen Aufgaben in dieser Kategorie 🎉";
        div.appendChild(hint);
      }
      b.tasks.forEach(t => div.appendChild(renderTaskRow(t)));
    }
    timeline.appendChild(div);
  });
}

function renderTaskRow(t) {
  const row = document.createElement("div");
  row.className = "task" + (t.done ? " done" : "");
  row.innerHTML = `
    <input type="checkbox" ${t.done ? "checked" : ""} data-id="${t.id}">
    <div>
      <div class="task-title">${t.important ? '<span class="star">★</span> ' : ""}${t.title}</div>
      <div class="task-meta"><span class="tag">${CATEGORIES[t.category].label}</span>~${t.estMin} Min.</div>
    </div>`;
  row.querySelector("input").addEventListener("change", e => {
    toggleDone(t.id, e.target.checked);
  });
  return row;
}

function toggleDone(id, done) {
  const t = tasks.find(x => x.id === id);
  t.done = done;
  saveTasks(tasks);
  renderAll();
}

// ---------- backlog ----------
function renderBacklog() {
  const container = document.getElementById("backlogGroups");
  container.innerHTML = "";
  Object.keys(CATEGORIES).forEach(cat => {
    const items = tasks.filter(t => t.category === cat && !t.done);
    const group = document.createElement("div");
    group.className = "cat-group";
    const head = document.createElement("div");
    head.className = "cat-head";
    head.innerHTML = `<span>${CATEGORIES[cat].label}</span><span class="cat-count">${items.length}</span>`;
    const body = document.createElement("div");
    body.className = "cat-body";
    items.forEach(t => body.appendChild(renderTaskRow(t)));
    if (items.length === 0) {
      const hint = document.createElement("div");
      hint.className = "empty-hint";
      hint.textContent = "Keine offenen Aufgaben";
      body.appendChild(hint);
    }
    head.addEventListener("click", () => body.classList.toggle("open"));
    group.appendChild(head);
    group.appendChild(body);
    container.appendChild(group);
  });
}

function renderDone() {
  const container = document.getElementById("doneList");
  container.innerHTML = "";
  const done = tasks.filter(t => t.done);
  if (done.length === 0) {
    container.innerHTML = '<div class="empty-hint">Noch nichts abgehakt.</div>';
    return;
  }
  done.forEach(t => container.appendChild(renderTaskRow(t)));
}

function renderCategoryOptions() {
  const select = document.getElementById("newCategory");
  select.innerHTML = "";
  Object.keys(CATEGORIES).forEach(cat => {
    const opt = document.createElement("option");
    opt.value = cat;
    opt.textContent = CATEGORIES[cat].label;
    select.appendChild(opt);
  });
}

function renderAll() {
  renderTimeline();
  renderBacklog();
  renderDone();
}

// ---------- header ----------
function renderHeader() {
  const dateLabel = document.getElementById("dateLabel");
  const now = new Date();
  dateLabel.textContent = now.toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" });
  document.getElementById("startTime").value = settings.startTime;
}

document.getElementById("startTime").addEventListener("change", e => {
  settings.startTime = e.target.value;
  saveSettings(settings);
  renderTimeline();
});

document.getElementById("addBtn").addEventListener("click", () => {
  const titleEl = document.getElementById("newTitle");
  const title = titleEl.value.trim();
  if (!title) return;
  const category = document.getElementById("newCategory").value;
  const estMin = Number(document.getElementById("newEst").value) || 30;
  const important = document.getElementById("newImportant").checked;
  tasks.push({ id: "t" + Date.now(), title, category, estMin, important, done: false, timePref: "any" });
  saveTasks(tasks);
  titleEl.value = "";
  document.getElementById("newImportant").checked = false;
  renderAll();
});

renderHeader();
renderCategoryOptions();
renderAll();
</script>
</body>
</html>
