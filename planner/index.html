<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tagesplaner</title>
<style>
  :root {
    --bg: #fdeef4;
    --card: #ffffff;
    --ink: #2b2226;
    --muted: #8a7480;
    --line: #f3d9e6;
    --accent: #d1698f;
    --accent-soft: #f8dcea;
    --urgent: #b23a5e;
    --urgent-soft: #f6dbe3;
    --done: #8fa88a;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 24px;
    max-width: 760px;
    margin: 0 auto;
  }
  header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 22px; margin: 0; }
  .date { color: var(--muted); font-size: 14px; }
  .settings { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .settings input[type=time] { border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font-size: 13px; }

  .block { background: var(--card); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; border: 1px solid var(--line); transition: background 0.1s, border-color 0.1s; }
  .block.fixed { background: var(--accent-soft); border-color: transparent; }
  .block.dropzone.dragover { border-color: var(--accent); background: var(--accent-soft); }
  .block-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .block-time { font-weight: 600; font-size: 14px; }
  .block-label { font-size: 13px; color: var(--muted); }

  .task { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); cursor: grab; }
  .task:first-child { border-top: none; }
  .task.snoozed { opacity: 0.5; }
  .task input[type=checkbox] { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
  .task-title { font-size: 14.5px; line-height: 1.35; }
  .task.done .task-title { text-decoration: line-through; color: var(--muted); }
  .task-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 20px; background: var(--accent-soft); color: var(--accent); font-size: 11px; margin-right: 6px; }
  .star { color: var(--accent); }
  .fire { color: var(--urgent); }

  .task-controls { display: flex; align-items: center; gap: 4px; margin-top: 5px; flex-wrap: wrap; }
  .ctrl-btn { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 2px 6px; font-size: 12px; cursor: pointer; opacity: 0.4; }
  .ctrl-btn.active { opacity: 1; border-color: var(--accent); background: var(--accent-soft); }
  .pin-select { font-size: 11.5px; border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px; color: var(--muted); }
  .est-input { width: 52px; }

  .expand-link { font-size: 12.5px; color: var(--accent); cursor: pointer; margin-top: 6px; display: inline-block; }

  section.backlog { margin-top: 28px; }
  section.backlog h2 { font-size: 16px; margin-bottom: 8px; }
  section.backlog.dropzone.dragover { outline: 2px dashed var(--accent); outline-offset: 6px; border-radius: var(--radius); }
  .cat-group { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 8px; overflow: hidden; }
  .cat-head { padding: 10px 14px; cursor: pointer; display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; }
  .cat-count { color: var(--muted); font-weight: 400; }
  .cat-body { padding: 0 14px 10px 14px; display: none; }
  .cat-body.open { display: block; }
  .cat-body .task { border-top: 1px solid var(--line); }
  .cat-body .task:first-child { border-top: 1px solid var(--line); }

  .add-form { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .add-form input[type=text] { flex: 1; min-width: 160px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 13.5px; }
  .add-form select, .add-form input[type=number] { padding: 8px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
  .add-form button { padding: 8px 14px; border: none; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; font-size: 13.5px; }
  label.important-check { display: flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--muted); }

  .done-section { margin-top: 24px; }
  .done-section h2 { font-size: 15px; color: var(--muted); }
  .empty-hint { color: var(--muted); font-size: 13px; padding: 6px 0; }
  .hint-small { color: var(--muted); font-size: 11.5px; margin: -4px 0 10px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Dein Tag</h1>
    <div class="date" id="dateLabel"></div>
  </div>
  <div class="settings">
    Start Arbeit: <input type="time" id="startTime">
  </div>
</header>

<div id="timeline"></div>

<section class="backlog dropzone" id="backlogSection">
  <h2>Alle offenen Aufgaben</h2>
  <div class="hint-small">Blöcke zeigen nur, was du reinziehst oder per Dropdown anheftest – es wird nichts automatisch nachgefüllt. ⭐ wichtig · 🔥 dringend/muss heute · ⏸ später (raus aus dem Plan, bleibt raus) · Minutenfeld zum Anpassen der Zeitschätzung.</div>
  <div id="backlogGroups"></div>

  <div class="add-form">
    <input type="text" id="newTitle" placeholder="Neue Aufgabe...">
    <select id="newCategory"></select>
    <input type="number" id="newEst" placeholder="Min." style="width:70px" value="30">
    <label class="important-check"><input type="checkbox" id="newImportant"> wichtig</label>
    <button id="addBtn">+ Hinzufügen</button>
  </div>
</section>

<section class="done-section">
  <h2>Heute erledigt</h2>
  <div id="doneList"></div>
</section>

<script>
const CATEGORIES = {
  creatives:  { label: "🎨 Creatives & Ads",   },
  automation: { label: "🤖 Automation/Tech",   },
  finance:    { label: "💰 Finance/PNL",       },
  shop:       { label: "🏪 Shop/Ops",          },
  funnel:     { label: "🎯 Funnel/CS",         },
  video:      { label: "🎬 Video/Content",     },
  team:       { label: "👥 Team/Sonstiges",    },
  errand:     { label: "🚗 Termine/Erledigungen" },
};

const BLOCK_LABELS = {
  block1: "Block 1 (Admin/Finance)",
  block2: "Block 2 (Creatives/Automation)",
  block3: "Block 3 (Shop/Funnel/Video)",
  deepwork: "Deep Work / Puffer",
};

const SEED_TASKS = [
  // Creatives & Ads
  { title: "Variations von winning ads zum Testen (Prompt)", category: "creatives", estMin: 45, important: true, pinnedBlock: "block2" },
  { title: "Workflow für Variations für winning products", category: "creatives", estMin: 60, important: true, urgent: true, pinnedBlock: "block2" },
  { title: "Research-Doc erstellen", category: "creatives", estMin: 60, important: true, pinnedBlock: "block2" },
  { title: "Kampagnen killen", category: "creatives", estMin: 20 },
  { title: "Skill bearbeiten", category: "creatives", estMin: 30 },

  // Automation/Tech
  { title: "Automation Images", category: "automation", estMin: 60 },
  { title: "N8n / Obsidian einrichten", category: "automation", estMin: 60 },
  { title: "Co-Work Automation Mail erstellen (Novelising)", category: "automation", estMin: 45 },
  { title: "Funnelish Email Automation", category: "automation", estMin: 60 },
  { title: "Extra Docs/Adapter für Claude Automation", category: "automation", estMin: 45 },
  { title: "Frontend nutzbar machen", category: "automation", estMin: 60 },

  // Finance/PNL
  { title: "PNL Noveliska", category: "finance", estMin: 45 },
  { title: "PNL Cowork", category: "finance", estMin: 45 },
  { title: "Lohn zahlen", category: "finance", estMin: 15 },
  { title: "Lohn Zain", category: "finance", estMin: 15 },
  { title: "SOP: Lohn-Fehler-Checker pro Person", category: "finance", estMin: 30 },
  { title: "Finance-Dokumente speichern", category: "finance", estMin: 20 },
  { title: "KPI eintragen", category: "finance", estMin: 20 },
  { title: "PNL Automation: Porto/Versandkosten ergänzen", category: "finance", estMin: 45, important: true, pinnedBlock: "block1" },
  { title: "PNL Automation: AdSpend vollständig eintragen", category: "finance", estMin: 45, important: true, pinnedBlock: "block1" },
  { title: "VAT-Setup Dokumente korrekt abspeichern (Infos + Shopify-Unterlagen)", category: "finance", estMin: 30 },

  // Shop/Ops
  { title: "Kizoora Änderungen im Shop", category: "shop", estMin: 30, snoozed: true },
  { title: "Neue Ad Accounts verknüpfen", category: "shop", estMin: 20, snoozed: true },
  { title: "Shopify-Fee ins PPL-Sheet eintragen", category: "shop", estMin: 15, snoozed: true },
  { title: "Shopify Abandon-Flow (dynamisches Update bei Checkout-Abbruch)", category: "shop", estMin: 45, pinnedBlock: "block3" },
  { title: "NL/BE UK-Ltd anmelden & launchen", category: "shop", estMin: 45, snoozed: true },
  { title: "Chargeflow IO einrichten", category: "shop", estMin: 30, snoozed: true },
  { title: "Chargeflow IO mit Valltrexo verbinden", category: "shop", estMin: 30, snoozed: true },
  { title: "E-Mail an CS wegen Valltrexo", category: "shop", estMin: 15 },
  { title: "Call: Pixel BM klären (aktuell gesperrt)", category: "shop", estMin: 30 },

  // Funnel/CS
  { title: "Aftersell-Funnel für Upsell", category: "funnel", estMin: 60, pinnedBlock: "block3" },
  { title: "Sweet Upsell für SP", category: "funnel", estMin: 45 },
  { title: "SP Support Catalog Finnisch", category: "funnel", estMin: 30 },
  { title: "Langes PDF für CS (72h Antwortzeit)", category: "funnel", estMin: 45 },

  // Video/Content
  { title: "Video skripten (Instagram)", category: "video", estMin: 45, pinnedBlock: "block3" },
  { title: "Video drehen (Instagram)", category: "video", estMin: 60 },
  { title: "Video schneiden", category: "video", estMin: 60 },

  // Team/Sonstiges
  { title: "Nachrichten mit Brayan klären", category: "team", estMin: 15 },
  { title: "Sop Kim", category: "team", estMin: 20 },
  { title: "PR", category: "team", estMin: 20 },
  { title: "Team Calls mit Team Members planen", category: "team", estMin: 30 },
  { title: "Nach neuer Customer-Service-Person suchen", category: "team", estMin: 30 },
];

const MIGRATION_KEY = "plannerMigrationVersion";
const CURRENT_MIGRATION = 4;

function withDefaults(t) {
  return { urgent: false, snoozed: false, pinnedBlock: null, ...t };
}

// ---------- storage ----------
function loadTasks() {
  const raw = localStorage.getItem("plannerTasks");
  if (!raw) {
    const seeded = SEED_TASKS.map((t, i) => withDefaults({ id: "t" + i, done: false, ...t }));
    localStorage.setItem("plannerTasks", JSON.stringify(seeded));
    localStorage.setItem(MIGRATION_KEY, String(CURRENT_MIGRATION));
    return seeded;
  }

  let list = JSON.parse(raw).map(withDefaults);
  const appliedVersion = Number(localStorage.getItem(MIGRATION_KEY) || "1");

  if (appliedVersion < 2) {
    const existingTitles = new Set(list.map(t => t.title));
    SEED_TASKS.forEach((seedT, i) => {
      if (!existingTitles.has(seedT.title)) {
        list.push(withDefaults({ id: "m2_" + i, done: false, ...seedT }));
      }
    });
    const urgentTitles = ["Workflow für Variations für winning products"];
    const snoozeTitles = ["Kizoora Änderungen im Shop", "Neue Ad Accounts verknüpfen", "Shopify-Fee ins PPL-Sheet eintragen"];
    list.forEach(t => {
      if (urgentTitles.includes(t.title)) t.urgent = true;
      if (snoozeTitles.includes(t.title)) t.snoozed = true;
    });
    localStorage.setItem(MIGRATION_KEY, "2");
  }

  if (appliedVersion < 3) {
    const existingTitles = new Set(list.map(t => t.title));
    SEED_TASKS.forEach((seedT, i) => {
      if (!existingTitles.has(seedT.title)) {
        list.push(withDefaults({ id: "m3_" + i, done: false, ...seedT }));
      }
    });
    const snoozeTitles = ["NL/BE UK-Ltd anmelden & launchen", "Chargeflow IO einrichten", "Chargeflow IO mit Valltrexo verbinden"];
    list.forEach(t => {
      if (snoozeTitles.includes(t.title)) t.snoozed = true;
    });
    localStorage.setItem(MIGRATION_KEY, "3");
  }

  if (appliedVersion < 4) {
    // Blocks no longer auto-fill from category pools — only explicitly
    // pinned tasks show up. Give already-existing installs a sensible
    // starting pin, but never override a pin the user already set/moved.
    const defaultPins = {
      "PNL Automation: Porto/Versandkosten ergänzen": "block1",
      "PNL Automation: AdSpend vollständig eintragen": "block1",
      "Variations von winning ads zum Testen (Prompt)": "block2",
      "Workflow für Variations für winning products": "block2",
      "Research-Doc erstellen": "block2",
      "Shopify Abandon-Flow (dynamisches Update bei Checkout-Abbruch)": "block3",
      "Aftersell-Funnel für Upsell": "block3",
      "Video skripten (Instagram)": "block3",
    };
    list.forEach(t => {
      if (!t.pinnedBlock && !t.snoozed && defaultPins[t.title]) {
        t.pinnedBlock = defaultPins[t.title];
      }
    });
    localStorage.setItem(MIGRATION_KEY, "4");
  }

  localStorage.setItem("plannerTasks", JSON.stringify(list));
  return list;
}
function saveTasks(tasks) {
  localStorage.setItem("plannerTasks", JSON.stringify(tasks));
}
function todayKey() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function loadSettings() {
  const raw = localStorage.getItem("plannerSettingsByDate");
  const all = raw ? JSON.parse(raw) : {};
  return all[todayKey()] || { startTime: "08:00" };
}
function saveSettings(s) {
  const raw = localStorage.getItem("plannerSettingsByDate");
  const all = raw ? JSON.parse(raw) : {};
  all[todayKey()] = s;
  localStorage.setItem("plannerSettingsByDate", JSON.stringify(all));
}

let tasks = loadTasks();
let settings = loadSettings();

// ---------- helpers ----------
function addMinutes(hhmm, mins) {
  const [h, m] = hhmm.split(":").map(Number);
  const total = h * 60 + m + mins;
  const nh = Math.floor(((total % 1440) + 1440) % 1440 / 60);
  const nm = ((total % 60) + 60) % 60;
  return String(nh).padStart(2, "0") + ":" + String(nm).padStart(2, "0");
}
function fmtRange(start, mins) {
  return start + "–" + addMinutes(start, mins);
}
function sortByPriority(list) {
  return list.slice().sort((a, b) => (b.urgent === true) - (a.urgent === true) || (b.important === true) - (a.important === true));
}
function tasksForBlock(blockId) {
  // A block only ever shows what's explicitly pinned to it — nothing gets
  // auto-filled in, so removing a task leaves the block with fewer items
  // instead of silently backfilling from the category.
  return sortByPriority(tasks.filter(t => !t.done && !t.snoozed && t.pinnedBlock === blockId));
}

// ---------- render timeline ----------
function renderTimeline() {
  const start = settings.startTime;
  const timeline = document.getElementById("timeline");
  timeline.innerHTML = "";

  const block1Start = start;
  const breakfastStart = addMinutes(start, 90);
  const block2Start = addMinutes(breakfastStart, 30);
  const lunchStart = addMinutes(block2Start, 180);
  const block3Start = addMinutes(lunchStart, 60);
  const deepworkStart = addMinutes(block3Start, 270);
  const dinnerStart = addMinutes(deepworkStart, 45);

  const blocks = [
    { id: "block1", time: fmtRange(block1Start, 90), label: "Arbeitsblock 1 – Admin & Finance", work: true, tasks: tasksForBlock("block1") },
    { time: fmtRange(breakfastStart, 30), label: "🍳 Frühstück", fixed: true },
    { id: "block2", time: fmtRange(block2Start, 180), label: "Arbeitsblock 2 – Creatives & Automation", work: true, tasks: tasksForBlock("block2") },
    { time: fmtRange(lunchStart, 60), label: "🍽️ Mittagessen", fixed: true },
    { id: "block3", time: fmtRange(block3Start, 270), label: "Arbeitsblock 3 – Shop, Funnel & Video (Abwechslung)", work: true, tasks: tasksForBlock("block3") },
    { id: "deepwork", time: fmtRange(deepworkStart, 45), label: "🧠 Deep Work / Puffer – frei wählbar, für Spontanes (Calls, Blocker)", work: true, freeform: true, tasks: tasksForBlock("deepwork") },
    { time: fmtRange(dinnerStart, 60), label: "🍲 Abendessen / Kochen", fixed: true },
    { time: "20:00–22:00", label: "🏋️ Gym", fixed: true },
  ];

  blocks.forEach(b => {
    const div = document.createElement("div");
    div.className = "block" + (b.fixed ? " fixed" : "") + (b.work ? " dropzone" : "");
    const head = document.createElement("div");
    head.className = "block-head";
    head.innerHTML = `<span class="block-time">${b.time}</span><span class="block-label">${b.label}</span>`;
    div.appendChild(head);

    if (b.work) {
      if (b.tasks.length === 0) {
        const hint = document.createElement("div");
        hint.className = "empty-hint";
        hint.textContent = "Noch nichts hier angeheftet – aus dem Rückstand unten reinziehen oder per Dropdown zuweisen.";
        div.appendChild(hint);
      }
      b.tasks.forEach(t => div.appendChild(renderTaskRow(t, { controls: true })));

      div.addEventListener("dragover", e => { e.preventDefault(); div.classList.add("dragover"); });
      div.addEventListener("dragleave", () => div.classList.remove("dragover"));
      div.addEventListener("drop", e => {
        e.preventDefault();
        div.classList.remove("dragover");
        const id = e.dataTransfer.getData("text/plain");
        const t = tasks.find(x => x.id === id);
        if (t) { t.pinnedBlock = b.id; saveTasks(tasks); renderAll(); }
      });
    }
    timeline.appendChild(div);
  });
}

function renderTaskRow(t, opts) {
  opts = opts || {};
  const row = document.createElement("div");
  row.className = "task" + (t.done ? " done" : "") + (t.snoozed ? " snoozed" : "");
  row.draggable = true;
  row.addEventListener("dragstart", e => e.dataTransfer.setData("text/plain", t.id));

  const meta = document.createElement("div");
  const titleDiv = document.createElement("div");
  titleDiv.className = "task-title";
  titleDiv.innerHTML = `${t.urgent ? '<span class="fire">🔥</span> ' : ""}${t.important ? '<span class="star">★</span> ' : ""}${t.title}`;
  const metaDiv = document.createElement("div");
  metaDiv.className = "task-meta";
  metaDiv.innerHTML = `<span class="tag">${CATEGORIES[t.category].label}</span>~${t.estMin} Min.`;
  meta.appendChild(titleDiv);
  meta.appendChild(metaDiv);

  const checkbox = document.createElement("input");
  checkbox.type = "checkbox";
  checkbox.checked = t.done;
  checkbox.addEventListener("change", e => toggleDone(t.id, e.target.checked));

  row.appendChild(checkbox);
  row.appendChild(meta);

  if (opts.controls) {
    const controls = document.createElement("div");
    controls.className = "task-controls";

    const mkBtn = (label, field, title) => {
      const btn = document.createElement("button");
      btn.className = "ctrl-btn" + (t[field] ? " active" : "");
      btn.textContent = label;
      btn.title = title;
      btn.addEventListener("click", () => { t[field] = !t[field]; saveTasks(tasks); renderAll(); });
      return btn;
    };
    controls.appendChild(mkBtn("⭐", "important", "wichtig"));
    controls.appendChild(mkBtn("🔥", "urgent", "dringend / muss heute"));
    controls.appendChild(mkBtn("⏸", "snoozed", "später (aus Vorschlägen ausblenden)"));

    const select = document.createElement("select");
    select.className = "pin-select";
    const noneOpt = document.createElement("option");
    noneOpt.value = "";
    noneOpt.textContent = "— nicht angeheftet —";
    select.appendChild(noneOpt);
    Object.keys(BLOCK_LABELS).forEach(bid => {
      const opt = document.createElement("option");
      opt.value = bid;
      opt.textContent = BLOCK_LABELS[bid];
      select.appendChild(opt);
    });
    select.value = t.pinnedBlock || "";
    select.addEventListener("change", e => {
      t.pinnedBlock = e.target.value || null;
      saveTasks(tasks);
      renderAll();
    });
    controls.appendChild(select);

    const estInput = document.createElement("input");
    estInput.type = "number";
    estInput.min = "5";
    estInput.step = "5";
    estInput.value = t.estMin;
    estInput.className = "pin-select est-input";
    estInput.title = "Geschätzte Minuten anpassen";
    estInput.addEventListener("change", e => {
      const v = Number(e.target.value);
      if (v > 0) t.estMin = v;
      saveTasks(tasks);
      renderAll();
    });
    controls.appendChild(estInput);

    meta.appendChild(controls);
  }

  return row;
}

function toggleDone(id, done) {
  const t = tasks.find(x => x.id === id);
  t.done = done;
  saveTasks(tasks);
  renderAll();
}

// ---------- backlog ----------
function renderBacklog() {
  const container = document.getElementById("backlogGroups");
  container.innerHTML = "";
  Object.keys(CATEGORIES).forEach(cat => {
    const items = tasks.filter(t => t.category === cat && !t.done);
    const group = document.createElement("div");
    group.className = "cat-group";
    const head = document.createElement("div");
    head.className = "cat-head";
    head.innerHTML = `<span>${CATEGORIES[cat].label}</span><span class="cat-count">${items.length}</span>`;
    const body = document.createElement("div");
    body.className = "cat-body";
    items.forEach(t => body.appendChild(renderTaskRow(t, { controls: true })));
    if (items.length === 0) {
      const hint = document.createElement("div");
      hint.className = "empty-hint";
      hint.textContent = "Keine offenen Aufgaben";
      body.appendChild(hint);
    }
    head.addEventListener("click", () => body.classList.toggle("open"));
    group.appendChild(head);
    group.appendChild(body);
    container.appendChild(group);
  });
}

function renderDone() {
  const container = document.getElementById("doneList");
  container.innerHTML = "";
  const done = tasks.filter(t => t.done);
  if (done.length === 0) {
    container.innerHTML = '<div class="empty-hint">Noch nichts abgehakt.</div>';
    return;
  }
  done.forEach(t => container.appendChild(renderTaskRow(t)));
}

function renderCategoryOptions() {
  const select = document.getElementById("newCategory");
  select.innerHTML = "";
  Object.keys(CATEGORIES).forEach(cat => {
    const opt = document.createElement("option");
    opt.value = cat;
    opt.textContent = CATEGORIES[cat].label;
    select.appendChild(opt);
  });
}

function renderAll() {
  renderTimeline();
  renderBacklog();
  renderDone();
}

// ---------- header ----------
function renderHeader() {
  const dateLabel = document.getElementById("dateLabel");
  const now = new Date();
  dateLabel.textContent = now.toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" });
  document.getElementById("startTime").value = settings.startTime;
}

document.getElementById("startTime").addEventListener("change", e => {
  settings.startTime = e.target.value;
  saveSettings(settings);
  renderTimeline();
});

document.getElementById("addBtn").addEventListener("click", () => {
  const titleEl = document.getElementById("newTitle");
  const title = titleEl.value.trim();
  if (!title) return;
  const category = document.getElementById("newCategory").value;
  const estMin = Number(document.getElementById("newEst").value) || 30;
  const important = document.getElementById("newImportant").checked;
  tasks.push(withDefaults({ id: "t" + Date.now(), title, category, estMin, important, done: false }));
  saveTasks(tasks);
  titleEl.value = "";
  document.getElementById("newImportant").checked = false;
  renderAll();
});

const backlogSection = document.getElementById("backlogSection");
backlogSection.addEventListener("dragover", e => { e.preventDefault(); backlogSection.classList.add("dragover"); });
backlogSection.addEventListener("dragleave", () => backlogSection.classList.remove("dragover"));
backlogSection.addEventListener("drop", e => {
  e.preventDefault();
  backlogSection.classList.remove("dragover");
  const id = e.dataTransfer.getData("text/plain");
  const t = tasks.find(x => x.id === id);
  if (t) { t.pinnedBlock = null; t.snoozed = true; saveTasks(tasks); renderAll(); }
});

renderHeader();
renderCategoryOptions();
renderAll();
</script>
</body>
</html>
